repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.4
    hooks:
      - id: gitleaks
        name: "Detect hardcoded secrets (gitleaks)"

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents, --unsafe]
      - id: check-json
      - id: check-merge-conflict
      - id: detect-private-key
        name: "Block private key files"
      - id: no-commit-to-branch
        args: [--branch, main]
        name: "Block direct commits to main (use a PR)"

  - repo: https://github.com/bridgecrewio/checkov
    rev: 3.2.0
    hooks:
      - id: checkov
        name: "Scan CloudFormation (checkov)"
        args:
          - --directory=infra/
          - --framework=cloudformation
          - --skip-check=CKV_AWS_18,CKV_AWS_21,CKV_AWS_144,CKV_AWS_145,CKV_AWS_126,CKV_AWS_135
