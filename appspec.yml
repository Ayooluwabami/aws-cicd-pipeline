version: 0.0
os: linux

# AWS CodeDeploy application specification
# Controls how the build artifact is installed on each EC2 instance
# and which lifecycle hooks run at each phase of the deployment.

files:
  - source: /
    destination: /var/www/aws-cicd-app
file_exists_behavior: OVERWRITE

permissions:
  - object: /var/www/aws-cicd-app/scripts
    pattern: "*.sh"
    mode: 755
    type:
      - file

hooks:
  ApplicationStop:
    - location: scripts/stop_server.sh
      timeout: 60
      runas: root
  BeforeInstall:
    - location: scripts/before_install.sh
      timeout: 120
      runas: root
  AfterInstall:
    - location: scripts/install_dependencies.sh
      timeout: 300
      runas: root
    - location: scripts/setup_monitoring.sh
      timeout: 120
      runas: root
  ApplicationStart:
    - location: scripts/start_server.sh
      timeout: 60
      runas: root
  ValidateService:
    - location: scripts/validate_service.sh
      timeout: 120
      runas: root
