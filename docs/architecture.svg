<svg viewBox="0 0 1000 660" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="AWS DevSecOps pipeline architecture">
  <title>AWS DevSecOps pipeline architecture</title>
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5F5E5A"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="660" fill="#FFFFFF"/>
  <text x="30" y="30" font-size="15" font-weight="500" fill="#2C2C2A">AWS DevSecOps pipeline architecture</text>

  <rect x="60" y="50" width="150" height="70" rx="6" fill="#F4F4F2" stroke="#888780"/>
  <text x="135" y="80" font-size="13" font-weight="500" fill="#2C2C2A" text-anchor="middle">Developer</text>
  <text x="135" y="99" font-size="11" fill="#5F5E5A" text-anchor="middle">git push</text>

  <line x1="212" y1="85" x2="284" y2="85" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arw)"/>

  <rect x="290" y="50" width="170" height="70" rx="6" fill="#F4F4F2" stroke="#888780"/>
  <text x="375" y="80" font-size="13" font-weight="500" fill="#2C2C2A" text-anchor="middle">GitHub repo</text>
  <text x="375" y="99" font-size="11" fill="#5F5E5A" text-anchor="middle">main + Dependabot</text>

  <path d="M 375 122 V 152 H 182 V 251" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arw)"/>
  <text x="385" y="145" font-size="11" fill="#5F5E5A">webhook trigger</text>

  <rect x="770" y="50" width="170" height="70" rx="6" fill="#F4F4F2" stroke="#888780"/>
  <text x="855" y="80" font-size="13" font-weight="500" fill="#2C2C2A" text-anchor="middle">End user</text>
  <text x="855" y="99" font-size="11" fill="#5F5E5A" text-anchor="middle">browser, port 3000</text>

  <path d="M 942 85 H 985 V 500 H 934" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arw)"/>

  <rect x="30" y="170" width="940" height="460" rx="10" fill="none" stroke="#B4B2A9" stroke-dasharray="6 5"/>
  <text x="50" y="196" font-size="12" font-weight="500" fill="#5F5E5A">AWS cloud</text>

  <rect x="60" y="215" width="880" height="160" rx="8" fill="#FDF0E0" stroke="#BA7517"/>
  <text x="80" y="241" font-size="13" font-weight="500" fill="#633806">AWS CodePipeline · cicd-demo-pipeline</text>

  <rect x="90" y="255" width="185" height="80" rx="6" fill="#FFFFFF" stroke="#BA7517"/>
  <text x="182" y="282" font-size="13" font-weight="500" fill="#633806" text-anchor="middle">1 · Source</text>
  <text x="182" y="302" font-size="11" fill="#854F0B" text-anchor="middle">CodeStar connection</text>
  <text x="182" y="318" font-size="11" fill="#854F0B" text-anchor="middle">pulls main on push</text>

  <line x1="277" y1="295" x2="299" y2="295" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arw)"/>

  <rect x="305" y="255" width="185" height="80" rx="6" fill="#FFFFFF" stroke="#BA7517"/>
  <text x="397" y="282" font-size="13" font-weight="500" fill="#633806" text-anchor="middle">2 · Security</text>
  <text x="397" y="302" font-size="11" fill="#854F0B" text-anchor="middle">gitleaks · npm audit</text>
  <text x="397" y="318" font-size="11" fill="#854F0B" text-anchor="middle">checkov (IaC scan)</text>

  <line x1="492" y1="295" x2="514" y2="295" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arw)"/>

  <rect x="520" y="255" width="185" height="80" rx="6" fill="#FFFFFF" stroke="#BA7517"/>
  <text x="612" y="282" font-size="13" font-weight="500" fill="#633806" text-anchor="middle">3 · Build</text>
  <text x="612" y="302" font-size="11" fill="#854F0B" text-anchor="middle">npm ci · node --test</text>
  <text x="612" y="318" font-size="11" fill="#854F0B" text-anchor="middle">package artifact</text>

  <line x1="707" y1="295" x2="729" y2="295" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arw)"/>

  <rect x="735" y="255" width="185" height="80" rx="6" fill="#FFFFFF" stroke="#BA7517"/>
  <text x="827" y="282" font-size="13" font-weight="500" fill="#633806" text-anchor="middle">4 · Deploy</text>
  <text x="827" y="302" font-size="11" fill="#854F0B" text-anchor="middle">CodeDeploy in-place</text>
  <text x="827" y="318" font-size="11" fill="#854F0B" text-anchor="middle">rollback on failure</text>

  <path d="M 612 335 V 385 H 215 V 424" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arw)"/>
  <text x="622" y="362" font-size="11" fill="#5F5E5A">uploads artifact</text>

  <rect x="100" y="430" width="230" height="70" rx="6" fill="#E1F5EE" stroke="#0F6E56"/>
  <text x="215" y="459" font-size="13" font-weight="500" fill="#04342C" text-anchor="middle">S3 artifact bucket</text>
  <text x="215" y="478" font-size="11" fill="#085041" text-anchor="middle">SSE-S3 · TLS-only policy</text>

  <line x1="332" y1="465" x2="634" y2="465" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arw)"/>
  <text x="483" y="455" font-size="11" fill="#5F5E5A" text-anchor="middle">agent pulls bundle</text>

  <path d="M 827 335 V 404" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arw)"/>
  <text x="837" y="378" font-size="11" fill="#5F5E5A">deploys revision</text>

  <rect x="640" y="410" width="290" height="185" rx="8" fill="#EEEDFE" stroke="#534AB7"/>
  <text x="660" y="434" font-size="12" font-weight="500" fill="#26215C">VPC · deployment group</text>
  <text x="660" y="450" font-size="11" fill="#534AB7">tag: Name = cicd-demo</text>

  <rect x="660" y="463" width="120" height="112" rx="6" fill="#FFFFFF" stroke="#7F77DD"/>
  <text x="720" y="487" font-size="12" font-weight="500" fill="#26215C" text-anchor="middle">EC2 instance</text>
  <text x="720" y="507" font-size="11" fill="#534AB7" text-anchor="middle">IMDSv2 · encrypted</text>
  <text x="720" y="523" font-size="11" fill="#534AB7" text-anchor="middle">CodeDeploy agent</text>
  <text x="720" y="539" font-size="11" fill="#534AB7" text-anchor="middle">ec2-user · :3000</text>

  <rect x="795" y="463" width="120" height="112" rx="6" fill="#FFFFFF" stroke="#7F77DD"/>
  <text x="855" y="487" font-size="12" font-weight="500" fill="#26215C" text-anchor="middle">EC2 instance</text>
  <text x="855" y="507" font-size="11" fill="#534AB7" text-anchor="middle">IMDSv2 · encrypted</text>
  <text x="855" y="523" font-size="11" fill="#534AB7" text-anchor="middle">CodeDeploy agent</text>
  <text x="855" y="539" font-size="11" fill="#534AB7" text-anchor="middle">ec2-user · :3000</text>

  <rect x="100" y="540" width="440" height="55" rx="6" fill="#F4F4F2" stroke="#B4B2A9"/>
  <text x="120" y="563" font-size="11" fill="#5F5E5A">Supporting services</text>
  <text x="120" y="582" font-size="12" fill="#2C2C2A">IAM · CloudWatch logs + alarms · X-Ray traces · SNS alerts</text>
</svg>
